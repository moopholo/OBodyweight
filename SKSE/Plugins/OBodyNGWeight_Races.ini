; ============================================================================
;  OBodyNGWeight_Races.ini  —  per-race / per-group body rules (NO rebuild)
; ============================================================================
; Retune how each race biases body-archetype selection, add ABSOLUTE exclusions
; (archetypes a group never rolls), and define your own custom groups that map
; modded races to bespoke rules. Edit, save, restart. A missing file, or any
; section/key you leave out, keeps the built-in defaults.
;
; This tuning only takes effect while "Race coherence" is > 0 in the MCM — EXCEPT
; hard exclusions (see below), which are absolute and apply even with coherence off.
;
; ── Sections ────────────────────────────────────────────────────────────────
;   [<group>]          female rules for a built-in group
;   [<group>.male]     male rules for a built-in group
;   [Group:<Name>]     define/extend a CUSTOM group (female)
;   [Group:<Name>.male]  its male rules
;
; Built-in groups: nord imperial breton redguard orc altmer bosmer dunmer
;                  khajiit argonian elder neutral
;
; ── Keys ────────────────────────────────────────────────────────────────────
;   Mult.<Archetype> = <float>   weight multiplier for one archetype (1 = neutral,
;                                >1 = more common for this group, <1 = rarer, 0 = off
;                                while coherence is on)
;   Exclude = A, B, C            archetypes this group NEVER rolls — ABSOLUTE, ignores
;                                the coherence slider. Prefix a name with '-' to REMOVE
;                                a built-in default exclusion (e.g. -Amazon).
;   FrameBias = <float>          additive body-VOLUME bias (not height)
;   Match = sub1, sub2           (custom groups only) race editorID/name substrings,
;                                lowercased; any match puts that race in this group.
;                                Applies to both sexes.
;
; Female archetypes: Balanced Rectangle Slim Pear TopHeavy Hourglass Voluptuous
;   AppleSoft BBW Athletic AthleticCurvy Obese Stocky Petite Amazon
;   "Inverted Triangle" Diamond Spoon MILF "Slim Thick" "Bottom Hourglass"
;   "Top Hourglass" Lollipop Strongwoman
; Male archetypes: Average Lean Fit Swimmer Soldier Dadbod Heavyset Stocky Lanky
;   Twink Bodybuilder Powerlifter
; (Names with spaces are written as-is, no quotes: e.g.  Mult.Slim Thick = 2.0)
;
; ── Built-in defaults you may want to know about ─────────────────────────────
; Elders (aged NPCs of any race) ship with these ABSOLUTE exclusions so they
; never get "sexy"/peak-athletic bodies, regardless of coherence:
;   [elder]       Exclude = Athletic, AthleticCurvy, Slim Thick, Amazon,
;                           Strongwoman, Lollipop, Top Hourglass, Bottom Hourglass, Spoon
;   [elder.male]  Exclude = Bodybuilder, Powerlifter, Fit, Swimmer
; They still roll soft/natural/mature shapes (AppleSoft, MILF, Voluptuous, BBW,
; Rectangle, Diamond, Dadbod, Heavyset…). To let elders roll a banned archetype
; again, un-exclude it, e.g.:
;   [elder]
;   Exclude = -Amazon
;
; ── Everything below is COMMENTED OUT — these are EXAMPLES, not active rules ──
; Uncomment and edit to use them.
;
; Make Nords lean even harder into broad/strong shapes:
; [nord]
; Mult.Stocky = 2.6
; Mult.Amazon = 1.8
; FrameBias   = 6
;
; Keep a specific overweight look off Bretons entirely (while coherence is on):
; [breton]
; Exclude = Obese, BBW
;
; Tune the men of a race independently of the women:
; [redguard.male]
; Mult.Soldier = 2.5
; Mult.Bodybuilder = 1.6
;
; Custom group: route a mod's snow-elf race to slender, non-heavy rules —
; the Match substrings are checked against the lowercased race editorID/name:
; [Group:SnowElf]
; Match       = snowelf, customsnowelf
; Mult.Slim   = 3.0
; Mult.Petite = 2.0
; Exclude     = BBW, Obese, Amazon
; [Group:SnowElf.male]
; Mult.Lean   = 3.0
; Mult.Lanky  = 2.0
