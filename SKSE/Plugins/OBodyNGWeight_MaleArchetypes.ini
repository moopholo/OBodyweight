; ============================================================================
;  OBodyNGWeight_MaleArchetypes.ini  —  tune the MALE body archetypes (NO rebuild)
; ============================================================================
; The male counterpart to OBodyNGWeight_Archetypes.ini. Every man is rolled into one
; of these HIMBO archetypes; each is a build (muscle/fat) + shape offsets plus a
; Weight (how often it's rolled). Retune both — the weights (which builds dominate the
; world) and the builds themselves — by editing this file. Edit, save, restart.
;
; - One [Section] per archetype. Every key is OPTIONAL — omit it to keep the built-in
;   value; delete a whole section to leave that archetype untouched.
; - Muscle / Fat are added to the per-NPC build draws (0-100 space). Shape offsets are
;   in 0-100 slider space: Waist < 0 = tighter V-taper, > 0 = thicker; Belly > 0 = gut.
;   Weight is the relative roll frequency (0 = never). Intensity scales overall SKEE
;   magnitude — the real lever for the muscular tail (a "150" bicep comes from intensity,
;   since slider values are clamped 0-100).
;
; Keys per section: Weight, Muscle, Fat, Shoulders, Waist, Belly, Arms, Tone, Intensity.
;
; Per-race biasing (e.g. Orc men favor Powerlifter, elders never Bodybuilder) lives in
; OBodyNGWeight_Races.ini under [<race>.male] — not here. This file is the shape/weight
; of each archetype; that file is who rolls it.
;
; The values below reproduce the built-in defaults, so this file changes nothing until
; you edit it. Example: to make ordinary fit men more common and shrink the huge tail:
;   [Fit]
;   Weight = 14
;   [Bodybuilder]
;   Weight = 1

