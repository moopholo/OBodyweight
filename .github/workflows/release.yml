name: Release

# On merge/push to main: cut a release (tag = upstream project version + a fork
# build suffix that restarts at 1 for every new upstream version: v1.6.2.1,
# v1.6.2.2, ...), then build the DLL and attach the MO2 archive to it.
#
# Note on the two stages: a release created with the built-in GITHUB_TOKEN does
# NOT trigger other workflows (GitHub's anti-recursion rule), so we can't rely on
# build.yml's `release: published` trigger for the automated path. Instead this
# workflow CALLS build.yml directly (workflow_call) after creating the release —
# same outcome, reliably. build.yml still fires on manually-published releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'project\([^)]*VERSION\s+\K[0-9]+(\.[0-9]+)*' plugin/CMakeLists.txt)
          # Fork suffix = highest existing v${V}.N release + 1 (first release of a new
          # upstream version is v${V}.1). The v1.5.2.x series used the run number,
          # which happened to match while the workflow was new.
          LAST=$(gh release list --limit 1000 --json tagName -q '.[].tagName' \
                 | grep -oP "^v\Q${V}\E\.\K[0-9]+$" | sort -n | tail -1 || true)
          N=$(( ${LAST:-0} + 1 ))
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}.${N}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --notes "Automated release from main @ ${{ github.sha }}.

          MO2-installable archive attached below: OBodyNGWeight.dll (fork build:
          INI-driven archetypes + race/group rules) + esp + tuned SKSE configs +
          BodyNet models. Install OVER the base OBodyNG Weight ${{ steps.ver.outputs.version }}
          mod — the compiled Papyrus scripts (.pex) come from it and must be the
          same upstream version."

  build:
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.create-release.outputs.tag }}
    secrets: inherit
